# 数据配置
data:
  custom_dataset: true  # 是否使用自定义数据集
  train_path: ./data/train.txt  # 自定义训练集路径
  val_path: ./data/val.txt  # 自定义验证集路径
  dataset_name: wikitext  # Hugging Face 数据集名称（当 custom_dataset=false 时使用）
  max_seq_length: 512

# 模型配置
model:
  tokenizer_name: gpt2  # 分词器名称
  model_name: gpt2  # 默认模型名称
  deepseek_model_name: deepseek-ai/deepseek-model  # DeepSeek 模型名称

# 训练配置
training:
  epochs: 10
  batch_size: 8
  val_batch_size: 16
  fp16: true
  grad_clip: 1.0
  out_dir: ../gen/train/outs
  save_interval: 1
  early_stop_patience: 3
  lr: 5e-5
  weight_decay: 0.01
  use_lora: false  # 是否使用 LoRA 微调

# LoRA 配置
lora:
  r: 8
  lora_alpha: 16
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.1

# 学习率调度
scheduler:
  type: linear
  warmup_steps: 100

# 日志配置
logging:
  log_dir: ../gen/train/logs
