# C/C++ with GCC – CI pipeline

trigger:
  - auto-dev

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    lfs: true

  - script: |
      set -e
      # build.sh test runs "git submodule update --init --recursive", which
      # would otherwise clone the full history of every submodule here
      git submodule update --init --recursive --depth=1
    displayName: 'Init submodules (shallow)'

  - script: |
      set -e
      ./build.sh all -j
    displayName: 'Build LinxSrvc'

  - script: |
      set -e
      # Checkout and pin Qt5 on demand when qmake is missing or not Qt5
      ./ci/checkout-qt5.sh
      ./build.sh QtGames/
    displayName: 'Build QtGames'

  - script: |
      set -e
      ./build.sh test
    displayName: 'Test & coverage'

  - script: |
      ./build.sh clean
    displayName: 'Clean workspace'
    condition: always()
