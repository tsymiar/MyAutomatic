# C/C++ with GCC – CI pipeline

trigger:
  - auto-dev

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    lfs: true

  - script: |
      set -e
      # build.sh test runs "git submodule update --init --recursive", which
      # would otherwise clone the full history of every submodule here
      git submodule update --init --recursive --depth=1
    displayName: 'Init submodules (shallow)'

  - script: |
      set -e
      ./build.sh all -j
    displayName: 'Build LinxSrvc'

  - script: |
      set -e
      export DEBIAN_FRONTEND=noninteractive
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends \
        qtbase5-dev \
        qt5-qmake \
        qtbase5-dev-tools \
        libqt5opengl5-dev \
        qtmultimedia5-dev \
        libgl1-mesa-dev \
        libglu1-mesa-dev \
        freeglut3-dev \
        libpng-dev \
        libsdl2-dev \
        libsdl2-image-dev \
        libsdl2-ttf-dev
      # build.sh builds Qt* targets only when /usr/bin/qmake is executable.
      # The runner image ships both Qt5 and Qt6, so pin it to Qt5.
      sudo ln -sf "$(dpkg -L qt5-qmake | grep -m1 '/qt5/bin/qmake$')" /usr/bin/qmake
      qmake --version | grep -q 'Qt version 5'
    displayName: 'Install Qt5 and dependencies'

  - script: |
      set -e
      ./build.sh QtGames/
    displayName: 'Build QtGames'

  - script: |
      set -e
      ./build.sh test
    displayName: 'Test & coverage'

  - script: |
      ./build.sh clean
    displayName: 'Clean workspace'
    condition: always()
