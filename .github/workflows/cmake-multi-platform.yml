# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "auto-dev" ]
  pull_request:
    branches: [ "auto-dev" ]

jobs:
  build:
    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-22.04

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, msvc, cl]
        include:
          - os: windows-latest
            c_compiler: msvc
            cpp_compiler: msvc
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: msvc

    steps:
    - uses: actions/checkout@v3
      with:
        lfs: false

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Building - make exec
      working-directory: ${{ github.workspace }}
      run: ./build.sh all -j

    - name: Building - make game
      if: runner.os == 'Linux'
      working-directory: ${{ github.workspace }}
      shell: bash
      run: |
        # build.sh builds Qt* targets only when /usr/bin/qmake is executable,
        # so Qt5 must be installed and pinned before building QtGames.
        if ! command -v qmake >/dev/null 2>&1 \
           || ! qmake --version | grep -q 'Qt version 5'; then
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev \
            qt5-qmake \
            qtbase5-dev-tools \
            libqt5opengl5-dev \
            qtmultimedia5-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            libpng-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-ttf-dev
          sudo ln -sf "$(dpkg -L qt5-qmake | grep -m1 '/qt5/bin/qmake$')" /usr/bin/qmake
        fi
        qmake --version
        ./build.sh QtGames

    - name: Test
      working-directory: ${{ github.workspace }}
      run: ./build.sh test

    - name: clean
      run: >
        ${{ github.workspace }}/build.sh clean
